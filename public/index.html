<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIPOND — PT Inti Prima Karya</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">

  <header class="top">
    <div class="brand brand-with-logo">
      <img class="brand-logo" src="sipond-logo.jpeg" alt="Logo SIPOND - PT Inti Prima Karya">
      <div class="brand-copy">
        <h1>SIPOND</h1>
        <p>Sistem Inventory Pisau Pond - PT Inti Prima Karya</p>
      </div>
    </div>
    <div class="stats" id="statsRow"></div>
  </header>
  <div id="sessionBar" class="session-bar"></div>

  <div class="grid">

    <section class="panel">
      <div class="panel-head">
        <h2>Katalog pisau</h2>
        <div style="display:flex; gap:6px; align-items:center; flex-wrap:wrap;">
          <button class="btn accent mini" onclick="openAddItemForm()">+ Tambah pisau</button>
          <button class="btn secondary small" onclick="document.getElementById('importFile').click()">Import dari Excel</button>
          <!-- Tombol Export ke Excel Katalog Pisau -->
          <button class="btn secondary small" onclick="exportKnifeInventory()">Export ke Excel</button>
        </div>
        <input type="file" id="importFile" accept=".xlsx,.xls,.csv" style="display:none;">
      </div>
      <div class="panel-body">
        <div class="toolbar">
          <div class="search-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
            <input type="text" id="searchInput" placeholder="Cari nama pisau, lokasi rak, atau customer...">
          </div>
          <select id="locationFilter"></select>
          <select id="customerFilter"></select>
          <label style="font-size:12.5px; display:flex; align-items:center; gap:6px; cursor:pointer; user-select:none;">
            <input type="checkbox" id="toggleDiscontinuedCb" onchange="toggleShowDiscontinued(this.checked)"> Tampilkan yang Discontinue
          </label>
        </div>
        <div id="importStatus" class="import-status"></div>
        <div class="bulk-bar">
          <label class="bulk-select-all"><input type="checkbox" id="selectAllCheckbox" onchange="toggleSelectAll(this.checked)"> Pilih semua yang tampil</label>
          <span id="bulkCount" class="hint"></span>
          <button class="btn small" id="bulkDeleteBtn" onclick="bulkDeleteSelected()" style="display:none;">Hapus yang dipilih</button>
        </div>
        <div class="catalog-list" id="catalogList"></div>
      </div>
    </section>

    <section class="panel" id="operatorPanel" style="position:sticky;top:20px;">
      <div class="panel-head">
        <h2>Meja operator</h2>
      </div>
      <div class="panel-body" id="operatorBody"></div>
    </section>

  </div>

  <section class="panel" style="margin-top:20px;">
    <div class="panel-head">
      <h2>Riwayat peminjaman</h2>
      <span class="hint" style="margin:0;">Menampilkan data hingga 6 bulan ke belakang</span>
    </div>
    <div class="panel-body">
      <div class="toolbar" style="margin-bottom:12px;">
        <div class="search-wrap" style="min-width:220px;">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <input type="text" id="historySearch" placeholder="Cari kode, operator, customer, SPK, atau produk...">
        </div>
        <select id="historyFilter">
          <option value="all">Semua status</option>
          <option value="dipinjam">Dipinjam</option>
          <option value="dikembalikan">Dikembalikan</option>
        </select>
        <select id="historyCustomerFilter"></select>
        <select id="historyLocationFilter"></select>
        <label class="hint" style="margin:0 0 0 4px;">Dari <input type="date" id="historyDateFrom" style="margin-left:4px;"></label>
        <label class="hint" style="margin:0;">Sampai <input type="date" id="historyDateTo" style="margin-left:4px;"></label>
        <button class="btn secondary small" onclick="resetHistoryFilters()">Reset filter</button>
        <button class="btn accent mini" onclick="exportHistory()">Export ke Excel</button>
      </div>
      <div class="history-bulk-bar">
        <label class="bulk-select-all"><input type="checkbox" id="historySelectAllCheckbox" onchange="toggleSelectAllHistory(this.checked)"> Pilih semua yang tampil</label>
        <span id="historyBulkCount" class="hint"></span>
        <button class="btn small" id="historyBulkPrintBtn" onclick="bulkPrintHistory()" style="display:none;">Cetak ulang yang dipilih</button>
      </div>
    </div>
    <div class="panel-body" style="overflow-x:auto; overflow-y:auto; max-height:450px; padding-top:0;">
      <table>
        <thead><tr>
          <th></th><th>Kode</th><th>Operator</th><th>Customer</th><th>No. SPK</th><th>Nama Produk</th><th>Detail Pisau</th><th>No Urut</th><th>Catatan</th><th>Pinjam</th><th>Kembali</th><th>Status</th><th>Aksi</th>
        </tr></thead>
        <tbody id="historyBody"></tbody>
      </table>
    </div>
  </section>

</div>

<div id="printArea"></div>

<script src="app.js"></script>
</body>
</html>
